<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - CodeHive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">Code<span>Hive</span></a>
        <ul class="nav-links">
            <li><a href="login.html">Login</a></li>
        </ul>
    </nav>

    <!-- REGISTER FORM -->
    <div class="auth-container">
        <div class="auth-box">
            <h2>Create Account</h2>
            <p>Join CodeHive and start sharing your code!</p>

            <div class="alert alert-error" id="error-msg"></div>
            <div class="alert alert-success" id="success-msg"></div>

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username" placeholder="Enter username" />
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="Enter email" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter password" />
            </div>

            <button class="btn btn-primary" onclick="register()">Create Account</button>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');

            // Hide previous messages
            errorMsg.classList.remove('show');
            successMsg.classList.remove('show');

            // Basic validation
            if (!username || !email || !password) {
                errorMsg.textContent = 'All fields are required!';
                errorMsg.classList.add('show');
                return;
            }

            if (password.length < 6) {
                errorMsg.textContent = 'Password must be at least 6 characters!';
                errorMsg.classList.add('show');
                return;
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, email, password })
                });

                const data = await response.json();

                if (!response.ok) {
                    errorMsg.textContent = data.message;
                    errorMsg.classList.add('show');
                    return;
                }

                successMsg.textContent = 'Account created! Redirecting to login...';
                successMsg.classList.add('show');

                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1500);

            } catch (error) {
                errorMsg.textContent = 'Something went wrong. Try again!';
                errorMsg.classList.add('show');
            }
        }
    </script>

</body>
</html>
