<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - CodeHive</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <a href="index.html" class="logo">Code<span>Hive</span></a>
        <ul class="nav-links">
            <li><a href="feed.html">Community</a></li>
            <li><a href="editor.html">New Snippet</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <!-- PROFILE CONTAINER -->
    <div class="feed-container">

        <!-- PROFILE HEADER -->
        <div class="card" style="margin-bottom:2rem; display:flex; align-items:center; gap:1.5rem;">
            <div style="width:70px; height:70px; border-radius:50%; background:var(--accent); display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:700; color:white;" id="avatar">?</div>
            <div>
                <h2 id="profile-username" style="font-size:1.5rem;">Loading...</h2>
                <p id="profile-email" style="color:var(--text-secondary); font-size:0.9rem; margin-top:0.2rem;"></p>
                <p id="profile-joined" style="color:var(--text-secondary); font-size:0.85rem; margin-top:0.2rem;"></p>
            </div>
            <div style="margin-left:auto; text-align:center;">
                <div style="font-size:1.8rem; font-weight:700; color:var(--accent);" id="snippet-count">0</div>
                <div style="color:var(--text-secondary); font-size:0.85rem;">Snippets</div>
            </div>
        </div>

        <!-- MY SNIPPETS -->
        <div class="feed-header">
            <h2>My Snippets</h2>
            <a href="editor.html" class="btn btn-primary">+ New Snippet</a>
        </div>

        <div class="snippets-grid" id="my-snippets-grid">
            <p style="color:var(--text-secondary);">Loading snippets...</p>
        </div>

    </div>

    <script>
        const token = localStorage.getItem('token');
        const user = JSON.parse(localStorage.getItem('user') || 'null');

        // Redirect if not logged in
        if (!token || !user) {
            window.location.href = 'login.html';
        }

        // Fill profile info
        document.getElementById('profile-username').textContent = user.username;
        document.getElementById('profile-email').textContent = user.email;
        document.getElementById('avatar').textContent = user.username.charAt(0).toUpperCase();

        // Load my snippets
        loadMySnippets();

        async function loadMySnippets() {
            try {
                const response = await fetch('/api/snippets/my/snippets', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                const snippets = await response.json();

                document.getElementById('snippet-count').textContent = snippets.length;

                const grid = document.getElementById('my-snippets-grid');

                if (snippets.length === 0) {
                    grid.innerHTML = `<p style="color:var(--text-secondary);">No snippets yet. <a href="editor.html" style="color:var(--accent);">Create one!</a></p>`;
                    return;
                }

                grid.innerHTML = snippets.map(snippet => `
                    <div class="snippet-card" id="card-${snippet.id}">
                        <h3 style="cursor:pointer;" onclick="viewSnippet(${snippet.id})">${escapeHtml(snippet.title)}</h3>
                        <div class="snippet-meta">
                            <span>🕒 ${formatDate(snippet.created_at)}</span>
                            <span>${snippet.is_public ? '🌍 Public' : '🔒 Private'}</span>
                        </div>
                        <div class="snippet-actions">
                            <button class="action-btn" onclick="viewSnippet(${snippet.id})">
                                ❤️ ${snippet.like_count}
                            </button>
                            <button class="action-btn" onclick="viewSnippet(${snippet.id})">
                                💬 ${snippet.comment_count}
                            </button>
                            <button class="action-btn" onclick="editSnippet(${snippet.id})">
                                ✏️ Edit
                            </button>
                            <button class="action-btn" onclick="deleteSnippet(${snippet.id})">
                                🗑️ Delete
                            </button>
                        </div>
                    </div>
                `).join('');

            } catch (error) {
                document.getElementById('my-snippets-grid').innerHTML = `
                    <p style="color:var(--accent);">Failed to load snippets!</p>
                `;
            }
        }

        // VIEW SNIPPET
        function viewSnippet(id) {
            window.location.href = `snippet.html?id=${id}`;
        }

        // EDIT SNIPPET
        function editSnippet(id) {
            window.location.href = `editor.html?id=${id}`;
        }

        // DELETE SNIPPET
        async function deleteSnippet(id) {
            if (!confirm('Are you sure you want to delete this snippet?')) return;

            try {
                const response = await fetch(`/api/snippets/${id}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (!response.ok) return;

                // Remove card from UI
                document.getElementById(`card-${id}`).remove();

                // Update count
                const countEl = document.getElementById('snippet-count');
                countEl.textContent = parseInt(countEl.textContent) - 1;

            } catch (error) {
                console.error('Delete failed:', error);
            }
        }

        // FORMAT DATE
        function formatDate(dateStr) {
            const date = new Date(dateStr);
            return date.toLocaleDateString('en-IN', {
                day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        // ESCAPE HTML
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.appendChild(document.createTextNode(text));
            return div.innerHTML;
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
